{{ define "main" }}
<div class="section-heading" style="padding-top:2.5rem;">
  <h2>All bags</h2>
</div>
<div class="catalog">
  {{ range .Pages.ByWeight }}
  <div class="item">
    <div class="item-art">{{ partial "bag-art.html" .Params.shape }}</div>
    <div class="item-text">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p class="desc">{{ .Params.description }}</p>
      <p class="materials">{{ .Params.materials }}</p>
      <p class="price">{{ .Params.price }}</p>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
