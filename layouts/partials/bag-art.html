{{ $shape := . }}
{{ if eq $shape "hero" }}
<svg class="bag-art" viewBox="0 0 260 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M60 90 L60 200 Q60 210 70 210 L190 210 Q200 210 200 200 L200 90 Z" stroke="var(--ink)" stroke-width="2.5"/>
  <path d="M85 90 V60 Q85 30 130 30 Q175 30 175 60 V90" stroke="var(--brass)" stroke-width="3" fill="none"/>
  <rect x="60" y="90" width="140" height="14" fill="var(--oxblood)" opacity="0.85"/>
  <circle cx="130" cy="130" r="4" fill="var(--brass)"/>
  <path d="M60 150 H200" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 5" opacity="0.5"/>
</svg>
{{ else if eq $shape "portrait" }}
<svg viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="60" cy="55" r="30" stroke="var(--ink)" stroke-width="2.5"/>
  <path d="M20 150 Q20 100 60 100 Q100 100 100 150" stroke="var(--ink)" stroke-width="2.5" fill="none"/>
</svg>
{{ else if eq $shape "tote" }}
<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="30" y="60" width="140" height="90" rx="6" stroke="var(--ink)" stroke-width="2.5" fill="none"/>
  <path d="M55 60 V40 Q55 20 100 20 Q145 20 145 40 V60" stroke="var(--moss)" stroke-width="3" fill="none"/>
  <line x1="30" y1="95" x2="170" y2="95" stroke="var(--ink)" stroke-width="1" opacity="0.4"/>
</svg>
{{ else if eq $shape "satchel" }}
<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="45" y="45" width="110" height="90" rx="4" stroke="var(--ink)" stroke-width="2.5"/>
  <rect x="60" y="30" width="80" height="18" rx="3" fill="var(--brass)" opacity="0.8"/>
  <circle cx="100" cy="90" r="5" fill="var(--oxblood)"/>
</svg>
{{ else if eq $shape "clutch" }}
<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="55" y="55" width="90" height="55" rx="10" stroke="var(--ink)" stroke-width="2.5"/>
  <path d="M55 65 Q100 40 145 65" stroke="var(--brass)" stroke-width="3" fill="none"/>
</svg>
{{ else if eq $shape "crossbody" }}
<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="60" y="55" width="80" height="70" rx="6" stroke="var(--ink)" stroke-width="2.5"/>
  <path d="M60 55 L30 20 M140 55 L170 20" stroke="var(--moss)" stroke-width="3"/>
</svg>
{{ else }}
<svg viewBox="0 0 200 160"></svg>
{{ end }}
